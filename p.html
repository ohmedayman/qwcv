<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>QCV Portfolio Redirect</title>
<script>
(function() {
    var hash = (window.location.hash || '').replace('#', '').trim();
    if (!hash) {
        var params = new URLSearchParams(window.location.search);
        hash = params.get('code') || '';
    }
    if (hash) {
        window.location.replace('/portfolio-view.html?code=' + encodeURIComponent(hash));
    } else {
        window.location.replace('/portfolio.html');
    }
})();
</script>
</head>
<body></body>
</html>
