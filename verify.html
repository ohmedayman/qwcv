<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>التحقق من سيرة ذاتية | QCV</title>
  <meta name="description" content="التحقق من صحة السيرة الذاتية - تأكد من أن السيرة الذاتية تم إنشاؤها وتوثيقها عبر QCV.">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/L59BQSvq/qcv-app-icon-final.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/qcv-ui.css">
  <style>
    body {
      background-color: var(--qcv-bg);
      font-family: var(--font-arabic);
      color: var(--qcv-text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .verify-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }
    .verify-card {
      width: 100%;
      max-width: 560px;
      background: var(--qcv-card);
      border: 1px solid var(--qcv-border);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    .verify-icon-box {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }
    .verify-icon-box.pending {
      background: var(--qcv-primary-light);
      color: var(--qcv-primary);
    }
    .verify-icon-box.success {
      background: #ecfdf5;
      color: var(--qcv-emerald);
    }
    .verify-icon-box.error {
      background: #fef2f2;
      color: #ef4444;
    }
    .verify-icon-box.loading {
      background: var(--qcv-primary-light);
      color: var(--qcv-primary);
    }
    .verify-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--qcv-text-main);
      margin-bottom: 8px;
    }
    .verify-subtitle {
      font-size: 0.95rem;
      color: var(--qcv-text-muted);
      margin-bottom: 28px;
    }
    .verify-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .verify-input {
      flex: 1;
      height: 48px;
      border: 1px solid var(--qcv-border);
      border-radius: var(--radius-md);
      padding: 0 16px;
      font-size: 1rem;
      font-family: var(--font-latin), var(--font-arabic);
      background: #ffffff;
      outline: none;
      direction: ltr;
      text-align: center;
      font-weight: 600;
      letter-spacing: 1px;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .verify-input:focus {
      border-color: var(--qcv-primary);
      box-shadow: 0 0 0 3px rgba(27, 77, 228, 0.12);
    }
    .verify-btn {
      height: 48px;
      padding: 0 28px;
      background: var(--qcv-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition-fast);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .verify-btn:hover {
      background: var(--qcv-primary-hover);
    }
    .verify-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .verify-result {
      margin-top: 24px;
      text-align: right;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--qcv-border);
      font-size: 0.92rem;
    }
    .result-row:last-child {
      border-bottom: none;
    }
    .result-label {
      color: var(--qcv-text-muted);
      font-weight: 600;
    }
    .result-value {
      font-weight: 700;
      color: var(--qcv-text-main);
    }
    .badge-verified {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background: #ecfdf5;
      color: var(--qcv-emerald);
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(27, 77, 228, 0.2);
      border-top-color: var(--qcv-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (max-width: 540px) {
      .verify-input-group {
        flex-direction: column;
      }
      .verify-card {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- VISITOR NAVBAR (PDF Specification Page 26) -->
  <header class="qcv-navbar">
    <div class="qcv-nav-inner">
      <a href="/" class="qcv-logo" aria-label="QCV Home">
        <span class="qcv-logo-text">QCV</span>
        <span class="qcv-logo-badge">Q</span>
      </a>

      <nav class="qcv-nav-links">
        <a href="/#features" class="qcv-nav-link">المميزات</a>
        <a href="/templates.html" class="qcv-nav-link">القوالب</a>
        <a href="/pricing.html" class="qcv-nav-link">الأسعار</a>
        <a href="/blog.html" class="qcv-nav-link">المدونة</a>
        <a href="/help.html" class="qcv-nav-link">المساعدة</a>
        <a href="/ats-checker.html" class="qcv-nav-link">فاحص ATS</a>
      </nav>

      <div class="qcv-nav-actions">
        <a href="/en/" class="qcv-btn qcv-btn-secondary" style="padding: 6px 12px; font-weight: 700;">EN</a>
        <a href="/login.html" class="qcv-btn qcv-btn-secondary">تسجيل الدخول</a>
        <a href="/login.html?mode=register" class="qcv-btn qcv-btn-primary">ابدأ مجانًا</a>
      </div>
    </div>
  </header>

  <main class="verify-main">
    <div class="verify-card">
      <div class="verify-icon-box pending" id="verifyIcon">
        <i class="fas fa-shield-halved"></i>
      </div>

      <h1 class="verify-title" id="verifyTitle">التحقق من سيرة ذاتية</h1>
      <p class="verify-subtitle" id="verifySubtitle">أدخل رمز التوثيق للتأكد من صحة السيرة</p>

      <div class="verify-input-group" id="verifyInputGroup">
        <input type="text" class="verify-input" id="verifyInput" placeholder="QCV-XXXX-XXXX" autocomplete="off" spellcheck="false">
        <button class="verify-btn" id="verifyBtn" onclick="doVerify()">
          تحقق
        </button>
      </div>

      <div id="verifyResult" style="display:none"></div>
    </div>
  </main>

  <footer style="padding: 24px; text-align: center; border-top: 1px solid var(--qcv-border); font-size: 0.88rem; color: var(--qcv-text-muted);">
    &copy; 2026 QCV. جميع الحقوق محفوظة. منصة التحقق من السير الذاتية المعتمدة.
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    (function() {
      var firebaseConfig = {apiKey:"AIzaSyA2pXUB830VPoro1BChDY0Ii5Gt_BTrK8I",authDomain:"qwcv-1cfad.firebaseapp.com",databaseURL:"https://qwcv-1cfad-default-rtdb.firebaseio.com",projectId:"qwcv-1cfad",storageBucket:"qwcv-1cfad.firebasestorage.app",messagingSenderId:"792471802122",appId:"1:792471802122:web:808e04099afc90315aaaf3"};
      firebase.initializeApp(firebaseConfig);
      var db = firebase.database();

      var params = new URLSearchParams(window.location.search);
      var code = params.get('code') || '';
      if (code) {
        document.getElementById('verifyInput').value = code;
        doVerify();
      }

      document.getElementById('verifyInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doVerify();
      });

      window.doVerify = function() {
        var input = document.getElementById('verifyInput').value.trim();
        if (!input) return;

        var icon = document.getElementById('verifyIcon');
        var title = document.getElementById('verifyTitle');
        var subtitle = document.getElementById('verifySubtitle');
        var result = document.getElementById('verifyResult');
        var btn = document.getElementById('verifyBtn');

        icon.className = 'verify-icon-box loading';
        icon.innerHTML = '<div class="spinner"></div>';
        title.textContent = 'جاري التحقق...';
        subtitle.textContent = '';
        result.style.display = 'none';
        btn.disabled = true;

        var cleanCode = input.replace(/^.*\/portfolio\//, '').replace(/[^a-zA-Z0-9]/g, '');

        db.ref('portfolioLinks/' + cleanCode).once('value').then(function(snap) {
          var uid = snap.val();
          if (!uid) {
            icon.className = 'verify-icon-box error';
            icon.innerHTML = '<i class="fas fa-times"></i>';
            title.textContent = 'رمز غير صالح';
            subtitle.textContent = 'لم يتم العثور على سيرة ذاتية مسجلة بهذا الرمز.';
            btn.disabled = false;
            return;
          }

          return Promise.all([
            db.ref('users/' + uid + '/cvData').once('value'),
            db.ref('users/' + uid + '/registeredAt').once('value')
          ]).then(function(snaps) {
            var cvData = snaps[0].val();
            if (!cvData) {
              icon.className = 'verify-icon-box error';
              icon.innerHTML = '<i class="fas fa-times"></i>';
              title.textContent = 'البيانات غير متوفرة';
              subtitle.textContent = 'الرمز صالح لكن ملف السيرة غير متوفر.';
              btn.disabled = false;
              return;
            }

            var registeredAt = snaps[1].val();
            var dateStr = registeredAt ? new Date(registeredAt).toLocaleDateString('ar-EG', {year:'numeric',month:'long',day:'numeric'}) : new Date().toLocaleDateString('ar-EG', {year:'numeric',month:'long',day:'numeric'});
            var cvName = cvData.name || 'مستخدم QCV';

            icon.className = 'verify-icon-box success';
            icon.innerHTML = '<i class="fas fa-check"></i>';
            title.textContent = 'تم التوثيق بنجاح';
            subtitle.textContent = '';

            var html = '<div class="badge-verified"><i class="fas fa-shield-halved"></i> سيرة موثّقة</div>';
            html += '<div class="verify-result">';
            html += '<div class="result-row"><span class="result-label">الاسم:</span><span class="result-value">' + escHtml(cvName) + '</span></div>';
            html += '<div class="result-row"><span class="result-label">تاريخ التوثيق:</span><span class="result-value">' + dateStr + '</span></div>';
            html += '<div class="result-row"><span class="result-label">رمز التوثيق:</span><span class="result-value" style="font-family:monospace;letter-spacing:1px">' + escHtml(cleanCode) + '</span></div>';
            html += '</div>';
            html += '<div style="margin-top: 24px;"><a href="portfolio-view.html?code=' + encodeURIComponent(cleanCode) + '" class="qcv-btn qcv-btn-primary" style="display:inline-flex; width:100%; justify-content:center;"><i class="fas fa-file-invoice" style="margin-left:8px;"></i> عرض السيرة الموثقة</a></div>';

            result.innerHTML = html;
            result.style.display = 'block';
            btn.disabled = false;
          });
        }).catch(function(err) {
          icon.className = 'verify-icon-box error';
          icon.innerHTML = '<i class="fas fa-times"></i>';
          title.textContent = 'خطأ في الاتصال';
          subtitle.textContent = 'حدث خطأ أثناء الاتصال بقاعدة البيانات. حاول مرة أخرى.';
          btn.disabled = false;
        });
      };

      function escHtml(s) {
        return (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
    })();
  </script>

  <script defer src="js/site-settings.js"></script>
</body>
</html>
